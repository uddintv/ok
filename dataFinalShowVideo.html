
<!DOCTYPE html>
<html>
<head>
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LIVE PLAYER</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body {
  margin:0!important;
  padding:0!important;
  width:100%;
  height:100%;
  background:#000!important;
  overflow:hidden!important;
}

#livePlayer {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
  z-index:999999;
}

#liveVideo {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

#liveButtons {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  gap:5px;
  padding:5px;
  box-sizing:border-box;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  z-index:9999999;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

#liveButtons::-webkit-scrollbar {
  display:none;
}

.live-btn {
  flex:0 0 auto;
  border:1px solid #16a34a;
  background:#22c55e;
  color:#000;
  border-radius:5px;
  padding:7px 12px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.live-btn.active {
  background:#000;
  color:#ffff00;
  border:1px solid #ffff00;
}

#liveButtons:empty {
  display:none;
}
</style>
</head>

<body>

<div id="livePlayer">
  <video id="liveVideo" autoplay muted playsinline></video>
  <div id="liveButtons"></div>
</div>

<script>
(function(){

"use strict";

const SOURCE =
"https://raw.githubusercontent.com/uddintv/ok/refs/heads/main/pageWithData.html";

const video = document.getElementById("liveVideo");
const buttonsBox = document.getElementById("liveButtons");

const params = new URLSearchParams(location.search);
const server = Number(params.get("server")) || 0;

let channels = [];
let hls = null;


// Fetch first page HTML
async function loadLive(){

  try {

    const response = await fetch(
      SOURCE + "?t=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok)
      throw new Error("Source fetch failed");

    const html = await response.text();

    const doc = new DOMParser().parseFromString(
      html,
      "text/html"
    );

    // Get only existing LIVE buttons
    const buttons = doc.querySelectorAll(
      "#liveButtons .live-btn[data-number][data-url]"
    );

    channels = Array.from(buttons).map(btn=>({

      number: Number(btn.dataset.number),

      name: btn.textContent.trim(),

      url: btn.dataset.url

    })).filter(item=>
      item.number > 0 &&
      /^https?:\/\//i.test(item.url)
    );

    // Optional server mode
    if(server > 0){

      channels = channels.filter(
        item=>item.number === server
      );

    }

    createButtons();

  } catch(error){

    console.error("LIVE fetch error:",error);

  }

}


// Create buttons
function createButtons(){

  buttonsBox.innerHTML = "";

  channels.forEach(channel=>{

    const btn = document.createElement("button");

    btn.className = "live-btn";
    btn.dataset.number = channel.number;
    btn.textContent = channel.name;

    btn.onclick = ()=>playChannel(channel);

    buttonsBox.appendChild(btn);

  });

  buttonsBox.style.display =
    channels.length ? "flex" : "none";

  // Auto play first available LIVE channel
  if(channels.length){

    playChannel(channels[0]);

  }

}


// Play video
function playChannel(channel){

  if(hls){

    hls.destroy();
    hls = null;

  }

  document.querySelectorAll(".live-btn").forEach(btn=>{

    btn.classList.toggle(
      "active",
      Number(btn.dataset.number) === channel.number
    );

  });

  video.pause();
  video.removeAttribute("src");
  video.load();

  if(Hls.isSupported()){

    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true
    });

    hls.loadSource(channel.url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{

      video.play().catch(()=>{});

    });

  } else if(
    video.canPlayType("application/vnd.apple.mpegurl")
  ){

    video.src = channel.url;
    video.play().catch(()=>{});

  }

}


// Load immediately
loadLive();


// Reload every 35 minutes
setTimeout(()=>{

  location.reload();

},35*60*1000);

})();





function loadLive(){

  const json = localStorage.getItem("liveChannelData");

  if(!json){
    console.log("No LIVE data available");
    return;
  }

  const data = JSON.parse(json);

  const channels = data.live || [];

  const buttonsBox = document.getElementById("liveButtons");

  buttonsBox.innerHTML = "";

  channels.forEach(channel=>{

    const btn = document.createElement("button");

    btn.className = "live-btn";
    btn.textContent = channel.name;
    btn.dataset.url = channel.url;

    btn.onclick = ()=>{
      playChannel(channel.url);
    };

    buttonsBox.appendChild(btn);

  });

}

  
</script>

</body>
</html>
