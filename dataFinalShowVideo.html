
<!DOCTYPE html>
<html>
<head>
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LIVE TV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body {
  margin:0!important;
  padding:0!important;
  width:100%;
  height:100%;
  background:#000!important;
  overflow:hidden!important;
}

#livePlayer {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
  z-index:999999;
}

#liveVideo {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

#liveButtons {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  flex-direction:row;
  flex-wrap:nowrap;
  gap:5px;
  padding:5px;
  box-sizing:border-box;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  z-index:9999999;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

#liveButtons::-webkit-scrollbar {
  display:none;
}

.live-btn {
  flex:0 0 auto;
  border:1px solid #16a34a;
  background:#22c55e;
  color:#000;
  border-radius:5px;
  padding:7px 12px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.live-btn.active {
  background:#000;
  color:#ffff00;
  border:1px solid #ffff00;
}

#liveButtons:empty {
  display:none;
}
</style>
</head>

<body>

<div id="livePlayer">
  <video id="liveVideo" autoplay muted playsinline></video>
  <div id="liveButtons"></div>
</div>

<script>
(function(){

"use strict";

// GitHub RAW HTML SOURCE
const DATA_URL =
"https://raw.githubusercontent.com/uddintv/ok/refs/heads/main/pageWithData.html";

const video = document.getElementById("liveVideo");
const buttonsBox = document.getElementById("liveButtons");

let channels = [];
let hls = null;
let activeNumber = 0;
let liveNumbers = [];
let scanning = false;

// Server parameter
const params = new URLSearchParams(location.search);
const serverParam = params.get("server");

const serverNumber =
  serverParam !== null && /^\d+$/.test(serverParam)
  ? Number(serverParam)
  : 0;

let singleMode = false;


// Fetch GitHub HTML and extract channel URLs
async function loadChannels(){

  try {

    const response = await fetch(DATA_URL,{
      method:"GET",
      cache:"no-store"
    });

    if(!response.ok)
      throw new Error("GitHub HTTP "+response.status);

    const html = await response.text();

    // Extract all m3u8 URLs from channels array
    const matches = [
      ...html.matchAll(
        /url\s*:\s*["']([^"']+\.m3u8(?:\?[^"']*)?)["']/g
      )
    ];

    const urls = [...new Set(
      matches.map(match=>match[1])
    )];

    if(!urls.length)
      throw new Error("No channel URLs found");

    channels = urls.map(url=>({url}));

    singleMode =
      serverNumber >= 1 &&
      serverNumber <= channels.length;

    console.log("Channels loaded:",channels.length);

    return true;

  } catch(error) {

    console.error("GitHub fetch failed:",error);

    return false;
  }
}


// Fetch text
async function getText(url){

  const controller = new AbortController();

  const timer = setTimeout(
    ()=>controller.abort(),
    10000
  );

  try {

    const response = await fetch(url,{
      method:"GET",
      mode:"cors",
      credentials:"omit",
      cache:"no-store",
      signal:controller.signal
    });

    if(!response.ok)
      throw new Error("HTTP "+response.status);

    return await response.text();

  } finally {

    clearTimeout(timer);

  }
}


// Check LIVE channel
async function checkChannel(number){

  const url = channels[number-1].url;

  try {

    let playlist = await getText(url);

    if(!playlist.trim().startsWith("#EXTM3U"))
      return false;

    let mediaUrl = url;

    let lines = playlist
      .split(/\r?\n/)
      .map(x=>x.trim());

    const masterIndex = lines.findIndex(
      x=>x.startsWith("#EXT-X-STREAM-INF")
    );

    if(masterIndex !== -1){

      const variant = lines
        .slice(masterIndex+1)
        .find(x=>x && !x.startsWith("#"));

      if(!variant) return false;

      mediaUrl = new URL(variant,url).href;

      playlist = await getText(mediaUrl);

      if(!playlist.trim().startsWith("#EXTM3U"))
        return false;

      lines = playlist
        .split(/\r?\n/)
        .map(x=>x.trim());
    }

    const segment = lines.find(
      x=>x && !x.startsWith("#")
    );

    if(!segment) return false;

    const segmentUrl = new URL(
      segment,
      mediaUrl
    ).href;

    const controller = new AbortController();

    const timer = setTimeout(
      ()=>controller.abort(),
      10000
    );

    try {

      const response = await fetch(segmentUrl,{
        method:"GET",
        mode:"cors",
        credentials:"omit",
        headers:{"Range":"bytes=0-1"},
        cache:"no-store",
        signal:controller.signal
      });

      return response.ok;

    } finally {

      clearTimeout(timer);

    }

  } catch(error) {

    console.warn("Channel "+number,error);

    return false;

  }
}


// Play channel
function playChannel(number){

  if(!channels[number-1]) return;

  activeNumber = number;

  video.style.display="block";
  video.muted = true;

  document.querySelectorAll(".live-btn").forEach(btn=>{

    btn.classList.toggle(
      "active",
      Number(btn.dataset.number)===number
    );

  });

  if(hls){

    hls.destroy();
    hls=null;

  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  const url = channels[number-1].url;

  if(Hls.isSupported()){

    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{

      video.play().catch(()=>{});

    });

  } else if(
    video.canPlayType("application/vnd.apple.mpegurl")
  ){

    video.src=url;
    video.play().catch(()=>{});

  }

}


// Create LIVE buttons
function updateButtons(){

  buttonsBox.innerHTML="";

  liveNumbers.forEach(number=>{

    const btn=document.createElement("button");

    btn.className="live-btn";
    btn.dataset.number=number;
    btn.textContent=number+" LIVE";

    btn.addEventListener("click",()=>{

      playChannel(number);

    });

    buttonsBox.appendChild(btn);

  });

  buttonsBox.style.display =
    liveNumbers.length ? "flex" : "none";

  if(liveNumbers.includes(activeNumber)){

    document.querySelectorAll(".live-btn").forEach(btn=>{

      btn.classList.toggle(
        "active",
        Number(btn.dataset.number)===activeNumber
      );

    });

  }

}


// Scan all channels
async function scanAll(){

  if(scanning) return;

  scanning=true;

  const targets = singleMode
    ? [serverNumber]
    : channels.map((_,index)=>index+1);

  const found=[];

  try {

    for(let i=0;i<targets.length;i+=3){

      const batch=targets.slice(i,i+3);

      const results=await Promise.all(
        batch.map(number=>checkChannel(number))
      );

      results.forEach((isLive,index)=>{

        if(isLive)
          found.push(batch[index]);

      });

    }

    liveNumbers=found;

    if(singleMode){

      buttonsBox.innerHTML="";
      buttonsBox.style.display="none";

      if(found.length){

        if(activeNumber!==serverNumber){

          playChannel(serverNumber);

        }

      } else {

        if(hls){

          hls.destroy();
          hls=null;

        }

        video.pause();
        video.removeAttribute("src");
        video.load();

      }

    } else {

      updateButtons();

      if(!found.includes(activeNumber) && found.length){

        playChannel(found[0]);

      }

      if(!activeNumber && found.length){

        playChannel(found[0]);

      }

    }

    console.log("LIVE Channels:",liveNumbers);

  } catch(error){

    console.error("Scan error:",error);

  } finally {

    scanning=false;

  }

}


// Start player
async function startPlayer(){

  const loaded = await loadChannels();

  if(!loaded){

    console.error("Unable to load GitHub channel data");

    return;

  }

  if(singleMode){

    if(serverNumber<1 || serverNumber>channels.length){

      console.error("Invalid server number");

      return;

    }

  }

  await scanAll();

}


// Initial start
startPlayer();


// Reload complete page every 35 minutes
setTimeout(()=>{

  location.reload();

},35*60*1000);

})();
</script>

</body>
</html>
