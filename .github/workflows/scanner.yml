
name: M3U8 Live Scanner

on:
  schedule:
    - cron: "5,35 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3u8-live-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requests
        run: pip install requests

      - name: Run M3U8 Scanner
        run: python scanner.py

      - name: Update Live JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto update live M3U8 links"
            git push
          else
            echo "No changes in live links"
          fi
